
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Attendance System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f6f8;
            color: #222;
        }

        h1 {
            color: #1f3a5f;
        }

        form {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        input {
            padding: 10px;
            margin: 10px 0;
        }

        button {
            padding: 10px 16px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }

        a {
            color: #1756a9;
        }
    </style>
</head>
<body>
    <h1>Staff Attendance System</h1>
    <p>Welcome. Enter your staff ID to record your attendance.</p>

    <form action="/attendance" method="POST">
        <label for="staff_id">Staff ID:</label><br>
        <input type="text" id="staff_id" name="staff_id" required><br>

        <button type="submit" name="action" value="clock_in">Clock In</button>
        <button type="submit" name="action" value="clock_out">Clock Out</button>
    </form>

    <p><a href="/records">View Attendance Records</a></p>
    <p><a href="/staff">View Registered Staff</a></p>
    <p><a href="/daily-report">View Daily Attendance Report</a></p>
    <p><a href="/register">Register Staff</a></p>
</body>
</html>
