
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Staff</title>
</head>
<body>
    <h1>Registered Staff</h1>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>Staff ID</th>
            <th>Full Name</th>
            <th>Department</th>
        </tr>

        {% for member in staff %}
        <tr>
            <td>{{ member[0] }}</td>
            <td><a href="/staff/{{ member[1] }}/records">{{ member[1] }}</a></td>
            <td>{{ member[2] }}</td>
            <td>{{ member[3] }}</td>
        </tr>
        {% endfor %}
    </table>

    <p><a href="/">Back to Home</a></p>
</body>
</html>
